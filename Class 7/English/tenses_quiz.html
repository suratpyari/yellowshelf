<style>
:root{
  color-scheme:light;
  --bg:#EDE7FB; --surface:#FFFFFF; --ink:#2E2350; --muted:#6B6290; --line:#D9CFF3;
  --accent:#7C5CD6; --accent-ink:#FFFFFF; --ok:#3E9B6A; --ok-bg:#DFF3E7; --bad:#D9725B; --bad-bg:#FBE5DF;
  --chip:#F4F0FD;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1,h2{font-family:Inter,"Trebuchet MS",system-ui,sans-serif;line-height:1.15;margin:0}
h1{font-size:clamp(2rem,6vw,2.8rem);font-weight:800}
h2{font-size:1.5rem;font-weight:700}
.sub{color:var(--muted);margin:6px 0 24px}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 5px 0 var(--line)}
.label{font-weight:700;margin:20px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid transparent;background:var(--chip);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:.95rem;cursor:pointer;display:flex;align-items:center;gap:8px}
.chip .dot{width:10px;height:10px;border-radius:50%}
.chip[aria-pressed="true"]{border-color:var(--accent);background:#E3DAFB}
.chip small{color:var(--muted)}
button{font:inherit}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:16px;box-shadow:0 4px 0 #5B3FB0;padding:14px 22px;font-weight:700;font-size:1.05rem;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);border:0;box-shadow:0 4px 0 var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;font-weight:600;color:var(--muted);font-size:.95rem}
.bar{height:8px;background:#fff;border-radius:99px;overflow:hidden;margin-bottom:18px}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;font-weight:700;color:var(--muted)}
.tag .dot{width:9px;height:9px;border-radius:50%}
.q{font-size:1.25rem;font-weight:700;margin:10px 0 18px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;font-size:1rem}
.opt b{flex:0 0 28px;height:28px;border-radius:8px;background:var(--chip);display:grid;place-items:center;font-size:.9rem}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok b{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad b{background:var(--bad);color:#fff}
.fb{margin-top:16px;padding:12px 14px;border-radius:12px;font-size:.98rem;display:none}
.fb.show{display:block}
.fb.ok{background:var(--ok-bg);border-left:5px solid var(--ok)}
.fb.bad{background:var(--bad-bg);border-left:5px solid var(--bad)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px}
.score{font-family:Inter,system-ui,sans-serif;font-size:clamp(3.5rem,14vw,5.5rem);font-weight:800;line-height:1}
.brk{display:grid;gap:8px;margin:18px 0}
.brk div{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;background:var(--chip);border-radius:10px;font-size:.95rem}
.rev{border-top:1px solid var(--line);padding:14px 0}
.rev p{margin:4px 0}
.rev .y{color:var(--bad)} .rev .c{color:var(--ok);font-weight:700}
.hidden{display:none!important}
.hint{color:var(--muted);font-size:.85rem}
.grid{display:grid;grid-template-columns:auto repeat(4,1fr);gap:4px;font-size:.8rem;margin-top:8px;overflow-x:auto}
.grid span{background:var(--chip);padding:6px 8px;border-radius:6px}
.grid .h{font-weight:700;background:transparent}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>
<style id="yellow-theme">

body{position:relative}
h1{font-weight:700;letter-spacing:-.02em}

 background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%201440%20110%22%20preserveAspectRatio%3D%22none%22%3E%3Cpath%20d%3D%22M0%2060C160%2020%20260%2020%20380%2050s200%2050%20340%2020%20240-70%20400-40%20230%2060%20320%2040V110H0Z%22%20fill%3D%22%23FFFBEB%22/%3E%3C/svg%3E") bottom/100% 60px no-repeat,
  radial-gradient(circle at 10% 25%,rgba(255,255,255,.35) 0 28px,transparent 29px),

.sub{color:#5B4B1E!important}
.chip[aria-pressed="true"]{background:#FFF4CC!important;border-color:#F5B400!important}
#startBtn,#nextBtn,#retryWrongBtn,.btn.primary{background:linear-gradient(180deg,#FFD24D,#FFC21A)!important;color:#1E293B!important;box-shadow:0 4px 0 #D99A00!important}
.bar{background:rgba(255,255,255,.7)!important}
.bar>i{background:linear-gradient(90deg,#FB923C,#F97316)!important}

<body>
<div class="wrap">

<section id="home">
  <h1>Grade 7 Tenses</h1>
  <p class="sub">Challenging level · all 12 tenses — simple, continuous, perfect and perfect continuous in present, past and future.</p>
  <div class="panel">
    <div class="label" style="margin-top:0">Sections</div>
    <div class="chips" id="chapChips"></div>
    <div class="label">Number of questions</div>
    <div class="chips" id="countChips"></div>
    <div class="row" style="margin-top:24px">
      <button class="btn" id="startBtn">Start quiz</button>
      <span class="hint" id="poolInfo"></span>
    </div>
  </div>
  <p class="hint" style="margin-top:14px">Tip: press 1–4 to pick an answer, Enter for the next question.</p>
</section>

<section id="quiz" class="hidden">
  <div class="top"><span id="qCount"></span><span id="qScore"></span></div>
  <div class="bar"><i id="qBar"></i></div>
  <div class="panel">
    <span class="tag" id="qTag"></span>
    <div class="q" id="qText"></div>
    <div class="opts" id="qOpts"></div>
    <div class="fb" id="qFb"></div>
    <div class="foot">
      <button class="btn ghost" id="quitBtn">End quiz</button>
      <button class="btn" id="nextBtn" disabled>Next</button>
    </div>
  </div>
</section>

<section id="result" class="hidden">
  <div class="panel">
    <h2>Your score</h2>
    <div class="row" style="align-items:baseline;margin-top:8px"><span class="score" id="rScore"></span><span id="rPct" style="font-weight:700;color:var(--muted)"></span></div>
    <p id="rMsg" style="margin:8px 0 0"></p>
    <div class="brk" id="rBrk"></div>
    <div class="row">
      <button class="btn" id="retryWrongBtn">Retry wrong answers</button>
      <button class="btn ghost" id="homeBtn">New quiz</button>
    </div>
  </div>
  <div class="panel" style="margin-top:16px" id="revPanel">
    <h2>Review mistakes</h2>
    <div id="rRev"></div>
  </div>
</section>

</div>

n up to now → present perfect continuous."], ["Where is Mother? — She ____ to the market.", ["has gone", "has been", "goes", "had gone"], "“Has gone” = went and is still there. “Has been” = went and came back."], ["Neither the teacher nor the students ____ the answer.", ["know", "knows", "is knowing", "has known"], "With “neither … nor”, the verb agrees with the nearer subject (“students” → plural)."], ["Each of the boys ____ a bicycle.", ["has", "have", "are having", "having"], "“Each” is singular → “has”."], ["Listen! Someone ____ at the door.", ["is knocking", "knocks", "has knocked", "knock"], "“Listen!” signals something happening now → present continuous."], ["Riya ____ the piano every evening.", ["practises", "is practising", "has practised", "practise"], "Habit/routine (“every evening”) → simple present; third person singular takes -s."], ["The train ____ at 6:15 tomorrow morning.", ["leaves", "is leave", "has left", "leaving"], "Fixed timetables use the simple present even for the future."], ["I ____ three chapters so far today.", ["have read", "read", "had read", "reads"], "“So far today” — the period isn’t over → present perfect."], ["She ____ to Delhi twice this year.", ["has been", "is going", "goes", "had gone"], "Experience within a period that isn’t over → present perfect."], ["We ____ a party tonight. Would you like to come?", ["are having", "have had", "had", "have been having"], "A fixed personal plan for the near future → present continuous."]]}, {"name": "Past tenses", "qs": [["When I reached the station, the train ____ already ____.", ["had … left", "has … left", "was … leaving", "did … leave"], "One past action completed before another past action → past perfect."], ["I ____ a shower when the phone rang.", ["was taking", "took", "had taken", "have taken"], "A longer action in progress interrupted by a short one → past continuous + simple past."], ["While Mother was cooking, Father ____ the newspaper.", ["was reading", "has read", "had been read", "reads"], "Two actions in progress at the same time → both past continuous."], ["She was tired because she ____ all afternoon.", ["had been studying", "has been studying", "was studied", "studies"], "Continuous action before a past moment, explaining a past result → past perfect continuous."], ["Columbus ____ America in 1492.", ["reached", "had reached", "has reached", "was reaching"], "A completed action at a definite past time → simple past."], ["By the time the doctor arrived, the patient ____.", ["had died", "has died", "dies", "is dying"], "“By the time” + past → the earlier action takes the past perfect."], ["We ____ for two hours before the bus finally came.", ["had been waiting", "have been waiting", "are waiting", "wait"], "Duration of an action up to a point in the past → past perfect continuous."], ["What ____ you ____ at 8 p.m. yesterday?", ["were … doing", "did … done", "have … done", "had … doing"], "Action in progress at a specific past time → past continuous."], ["She ____ never ____ an elephant until she visited Kerala.", ["had … seen", "has … seen", "did … see", "was … seeing"], "Experience up to a past point (“until she visited”) → past perfect."], ["The ground was wet. It ____ all night.", ["had been raining", "has been raining", "rains", "is raining"], "Continuous action before a past moment with visible result → past perfect continuous."], ["He ____ to school every day when he was young.", ["walked", "was walking", "has walked", "had been walk"], "Past habit → simple past (or “used to walk”)."], ["The thief ____ while the family was sleeping.", ["broke in", "was breaking in", "had been broke in", "breaks in"], "Short action during a longer one → simple past for the short action."], ["She told me that she ____ the film before.", ["had seen", "has seen", "sees", "was seeing"], "Reported speech moves present perfect back to past perfect."], ["They ____ football when it started to rain.", ["were playing", "played", "had played", "have played"], "Action in progress interrupted → past continuous."], ["I ____ my keys, so I couldn’t open the door.", ["had lost", "have lost", "was losing", "lose"], "Losing the keys happened before not being able to open the door → past perfect."], ["After she ____ her dinner, she went to bed.", ["had eaten", "has eaten", "eats", "was eaten"], "First of two past actions → past perfect."], ["Hardly ____ the match begun when it started to rain.", ["had", "has", "did", "was"], "“Hardly … when” takes the past perfect with inverted order: “Hardly had the match begun …”."], ["Last summer we ____ to Shimla and ____ a great time.", ["went … had", "go … have", "had gone … had", "were going … having"], "Completed actions at a finished past time → simple past."], ["He ____ there for ten years before he retired.", ["had been working", "has been working", "is working", "works"], "Duration up to a past event → past perfect continuous."], ["At this time last year, I ____ for my exams.", ["was preparing", "prepared", "have prepared", "am preparing"], "Action in progress at a specific past time → past continuous."]]}, {"name": "Future tenses", "qs": [["By next March, I ____ in this city for ten years.", ["will have been living", "will live", "will be living", "have lived"], "Duration up to a future point → future perfect continuous."], ["Don’t call at 9 tonight; I ____ dinner then.", ["will be having", "will have", "have", "will have had"], "Action in progress at a future time → future continuous."], ["By the time you arrive, we ____ the cake.", ["will have eaten", "will eat", "ate", "are eating"], "Action completed before a future time → future perfect."], ["Look at those dark clouds! It ____ rain.", ["is going to", "will be", "shall have", "has"], "A prediction based on present evidence → “be going to”."], ["I’m thirsty. — Wait, I ____ get you some water.", ["will", "am going to have", "had", "was"], "A decision made at the moment of speaking → “will”."], ["This time tomorrow, we ____ over the Himalayas.", ["will be flying", "will fly", "will have flown", "fly"], "“This time tomorrow” → future continuous."], ["If it rains tomorrow, we ____ at home.", ["will stay", "stay", "would stayed", "will be stayed"], "First conditional: if + simple present, will + base verb."], ["She ____ the report by Friday evening.", ["will have finished", "will be finish", "finishes", "has finished"], "“By + future time” → future perfect."], ["By December, Arun ____ the guitar for two years.", ["will have been learning", "will learn", "is learning", "has learnt"], "Duration up to a future point → future perfect continuous."], ["I will call you as soon as I ____ home.", ["reach", "will reach", "will have reach", "reached"], "In time clauses (as soon as, when, until, after), use the simple present for the future."], ["When you ____ tomorrow, I will show you my project.", ["come", "will come", "came", "will have come"], "Time clause with “when” → simple present, not “will”."], ["By 2030, scientists ____ a cure, I hope.", ["will have found", "will be finding", "find", "found"], "Completed by a future time → future perfect."], ["Tomorrow at noon, Grandma ____ in her garden as usual.", ["will be working", "will have worked", "works", "worked"], "Action in progress at a stated future time → future continuous."], ["The match ____ at 4 p.m. tomorrow, according to the schedule.", ["starts", "started", "has started", "had started"], "Scheduled events → simple present with future meaning."], ["____ you ____ the car tomorrow? I need to borrow it.", ["Will … be using", "Will … have used", "Do … use", "Did … use"], "Polite question about future plans → future continuous."], ["Don’t worry, I ____ the secret to anyone.", ["won’t tell", "don’t tell", "didn’t tell", "haven’t told"], "Promise about the future → will/won’t."], ["By the end of this term, we ____ twelve chapters.", ["will have covered", "will cover", "have covered", "are covering"], "Completed before a future time → future perfect."], ["Next week, she ____ here for exactly one month.", ["will have been", "will be", "is", "has been"], "A state completed up to a future point — stative verb “be” → future perfect."], ["They ____ married next June — the invitations are printed.", ["are getting", "get", "got", "have got"], "Fixed arrangement → present continuous for the future."], ["Hurry up! The film ____ by the time we get there.", ["will have started", "will start", "starts", "has started"], "Completed before another future event → future perfect."]]}, {"name": "Identify the tense", "qs": [["“She has been painting since morning.”", ["Present perfect continuous", "Present perfect", "Past perfect continuous", "Present continuous"], "has/have been + -ing."], ["“They had finished their work.”", ["Past perfect", "Simple past", "Present perfect", "Past perfect continuous"], "had + past participle."], ["“I will be waiting for you.”", ["Future continuous", "Simple future", "Future perfect", "Present continuous"], "will be + -ing."], ["“He will have left by then.”", ["Future perfect", "Future continuous", "Simple future", "Past perfect"], "will have + past participle."], ["“We were watching TV.”", ["Past continuous", "Simple past", "Present continuous", "Past perfect continuous"], "was/were + -ing."], ["“The sun rises in the east.”", ["Simple present", "Present continuous", "Simple past", "Present perfect"], "Base verb / verb + s."], ["“By noon, she will have been cooking for five hours.”", ["Future perfect continuous", "Future perfect", "Future continuous", "Present perfect continuous"], "will have been + -ing."], ["“I have lost my pen.”", ["Present perfect", "Simple past", "Past perfect", "Present perfect continuous"], "has/have + past participle."], ["“He had been working there for years.”", ["Past perfect continuous", "Past perfect", "Past continuous", "Present perfect continuous"], "had been + -ing."], ["“She will win the race.”", ["Simple future", "Future continuous", "Future perfect", "Simple present"], "will + base verb."], ["“The bus leaves at 7 tomorrow.”", ["Simple present (with future meaning)", "Simple future", "Present continuous", "Future continuous"], "The verb form is simple present, even though it refers to the future."], ["“Are you coming to the party tonight?”", ["Present continuous (future plan)", "Future continuous", "Simple present", "Simple future"], "am/is/are + -ing — used here for a future arrangement."], ["“I was told the news.”", ["Simple past (passive)", "Past continuous", "Past perfect", "Present perfect (passive)"], "was/were + past participle = simple past passive."], ["“The house is being painted.”", ["Present continuous (passive)", "Present perfect (passive)", "Simple present (passive)", "Past continuous (passive)"], "is/are being + past participle."], ["“The letter has been posted.”", ["Present perfect (passive)", "Present perfect continuous", "Past perfect (passive)", "Simple past (passive)"], "has/have been + past participle (not -ing) → passive present perfect."], ["“The bridge was being built when the flood came.”", ["Past continuous (passive)", "Past perfect (passive)", "Simple past (passive)", "Past perfect continuous"], "was/were being + past participle."], ["“By then, the work will have been completed.”", ["Future perfect (passive)", "Future perfect continuous", "Future continuous", "Simple future (passive)"], "will have been + past participle."], ["“Did you enjoy the trip?”", ["Simple past", "Present perfect", "Past continuous", "Simple present"], "did + base verb in questions."]]}, {"name": "Spot the correct sentence", "qs": [["Which sentence is correct?", ["I saw him yesterday.", "I have seen him yesterday.", "I had saw him yesterday.", "I have saw him yesterday."], "A definite past time (yesterday) takes the simple past, not the present perfect."], ["Which sentence is correct?", ["She knows the answer.", "She is knowing the answer.", "She knowing the answer.", "She has knowing the answer."], "“Know” is a stative verb — not used in continuous forms."], ["Which sentence is correct?", ["I have been here since 9 o’clock.", "I am here since 9 o’clock.", "I was here since 9 o’clock.", "I am being here since 9 o’clock."], "“Since” + continuing situation → present perfect."], ["Which sentence is correct?", ["He did not go to school.", "He did not went to school.", "He did not goes to school.", "He not went to school."], "After did/does/do, use the base verb."], ["Which sentence is correct?", ["When I grow up, I will be a doctor.", "When I will grow up, I will be a doctor.", "When I grew up, I will be a doctor.", "When I am grow up, I will be a doctor."], "No “will” in time clauses with when."], ["Which sentence is correct?", ["They have been living here for years.", "They have been lived here for years.", "They are living here for years.", "They living here for years."], "Duration up to now → have been + -ing."], ["Which sentence is correct?", ["Did you finish your work?", "Did you finished your work?", "Do you finished your work?", "Did you finishing your work?"], "did + base verb."], ["Which sentence is correct?", ["She has gone home.", "She has went home.", "She have gone home.", "She has go home."], "Past participle of “go” is “gone”."], ["Which sentence is correct?", ["He finished his work an hour ago.", "He has finished his work an hour ago.", "He had finish his work an hour ago.", "He has finish his work an hour ago."], "“Ago” marks a finished past time → simple past."], ["Which sentence is correct?", ["How long have you been waiting?", "Since when are you waiting?", "How long are you waiting?", "How long you are waiting?"], "Duration up to now → present perfect continuous."], ["Which sentence is correct?", ["If he comes, I will tell him.", "If he will come, I will tell him.", "If he came, I will tell him.", "If he come, I will tell him."], "if + simple present in first conditionals."], ["Which sentence is correct?", ["The children were playing.", "The children was playing.", "The children is playing yesterday.", "The children were play."], "“Children” is plural → “were”."], ["Which sentence is correct?", ["Every morning, my father goes for a walk.", "Every morning, my father go for a walk.", "Every morning, my father going for a walk.", "Every morning, my father is go for a walk."], "Third person singular in simple present takes -s/-es."], ["Which sentence is correct?", ["She had written the letter before I came.", "She had wrote the letter before I came.", "She has wrote the letter before I came.", "She had write the letter before I came."], "Past participle of “write” is “written”."], ["Which sentence is correct?", ["We have known each other for years.", "We are knowing each other for years.", "We have been knowing each other for years.", "We know each other since years."], "Stative “know” + duration → present perfect."], ["Which sentence is correct?", ["By next year, he will have completed the course.", "By next year, he will completed the course.", "By next year, he has completed the course.", "By next year, he will have complete the course."], "will have + past participle."], ["Which sentence is correct?", ["I didn’t know that he had moved to Pune.", "I didn’t knew that he had moved to Pune.", "I don’t knew that he moved to Pune.", "I didn’t know that he has moving to Pune."], "didn’t + base verb; earlier past action → past perfect."], ["Which sentence is correct?", ["She will be arriving at 5 p.m.", "She will be arrive at 5 p.m.", "She will arriving at 5 p.m.", "She will being arriving at 5 p.m."], "Future continuous = will be + -ing."]]}, {"name": "Change the tense", "qs": [["Change to present perfect: “She writes a letter.”", ["She has written a letter.", "She had written a letter.", "She has wrote a letter.", "She is writing a letter."], "has + past participle (written)."], ["Change to past continuous: “They play cricket.”", ["They were playing cricket.", "They are playing cricket.", "They had played cricket.", "They was playing cricket."], "were + -ing."], ["Change to future perfect: “He completes the task.”", ["He will have completed the task.", "He will complete the task.", "He will be completing the task.", "He has completed the task."], "will have + past participle."], ["Change to past perfect continuous: “I work in the garden.”", ["I had been working in the garden.", "I have been working in the garden.", "I was working in the garden.", "I had worked in the garden."], "had been + -ing."], ["Change to negative: “He went to school.”", ["He did not go to school.", "He did not went to school.", "He not went to school.", "He has not go to school."], "did not + base verb."], ["Change to a question: “She has finished the work.”", ["Has she finished the work?", "Did she finished the work?", "Has she finish the work?", "Does she has finished the work?"], "Move “has” before the subject."], ["Change to a question: “They were dancing.”", ["Were they dancing?", "Did they dancing?", "Was they dancing?", "Are they dancing?"], "Move “were” before the subject."], ["Change to negative: “She will have reached.”", ["She will not have reached.", "She will have not reach.", "She not will have reached.", "She will not has reached."], "“not” goes after the first auxiliary (will)."], ["Change to a question: “He plays chess.”", ["Does he play chess?", "Does he plays chess?", "Do he play chess?", "Is he play chess?"], "does + subject + base verb."], ["Change to future continuous: “We travel to Goa.”", ["We will be travelling to Goa.", "We will travel to Goa.", "We will have travelled to Goa.", "We are travelling to Goa."], "will be + -ing."], ["Change to present perfect continuous: “The baby sleeps.”", ["The baby has been sleeping.", "The baby is sleeping.", "The baby had been sleeping.", "The baby has slept."], "has been + -ing."], ["Change to future perfect continuous: “They build the bridge.”", ["They will have been building the bridge.", "They will have built the bridge.", "They will be building the bridge.", "They have been building the bridge."], "will have been + -ing."], ["Change to simple past: “The birds fly south.”", ["The birds flew south.", "The birds flied south.", "The birds have flown south.", "The birds flown south."], "Past of “fly” is “flew”."], ["Change to past perfect: “The guests arrive.”", ["The guests had arrived.", "The guests have arrived.", "The guests arrived.", "The guests had arrive."], "had + past participle."], ["Change to a negative question: “You have eaten lunch.”", ["Haven’t you eaten lunch?", "Didn’t you have eaten lunch?", "Haven’t you ate lunch?", "Don’t you have eaten lunch?"], "Have + n’t + subject + past participle."], ["Reported speech: He said, “I am reading a book.” → He said that he ____ a book.", ["was reading", "is reading", "had read", "reads"], "Present continuous shifts back to past continuous."]]}, {"name": "Tricky verb forms", "qs": [["The children have ____ across the lake.", ["swum", "swam", "swimmed", "swimming"], "swim – swam – swum."], ["The bell has ____. Let’s go in.", ["rung", "rang", "ringed", "ring"], "ring – rang – rung."], ["The sun had already ____ when we woke up.", ["risen", "rose", "raised", "rised"], "rise – rose – risen. (“Raise” needs an object.)"], ["He has ____ in bed all day because of fever.", ["lain", "laid", "lied", "lay"], "lie (rest) – lay – lain. “Laid” is from “lay” (put down); “lied” means told a lie."], ["Who has ____ my bicycle?", ["stolen", "stole", "stealed", "steal"], "steal – stole – stolen."], ["The leaves have ____ from the trees.", ["fallen", "fell", "felled", "fall"], "fall – fell – fallen."], ["She has ____ her best dress for the party.", ["worn", "wore", "weared", "wearing"], "wear – wore – worn."], ["They had ____ the whole pizza before we arrived.", ["eaten", "ate", "eated", "eat"], "eat – ate – eaten."], ["Yesterday the hen ____ two eggs.", ["laid", "lay", "lied", "lain"], "lay (put down/produce) – laid – laid."], ["The river has ____ its banks after the heavy rain.", ["overflowed", "overflown", "overflew", "overflowen"], "overflow – overflowed – overflowed."], ["He ____ the ball over the wall yesterday.", ["threw", "throwed", "thrown", "throws"], "throw – threw – thrown."], ["The pond had ____ by the morning.", ["frozen", "froze", "freezed", "freezing"], "freeze – froze – frozen."], ["I have ____ this book three times.", ["read", "readed", "red", "reading"], "read – read – read (spelt the same, pronounced “red” in past forms)."], ["The child ____ on the floor and went to sleep.", ["lay", "laid", "lied", "lain"], "lie (rest) – lay – lain; simple past is “lay”."], ["The price of vegetables has ____ sharply this month.", ["risen", "raised", "rose", "rised"], "Prices rise by themselves → “has risen”."], ["She had ____ a beautiful song at the function.", ["sung", "sang", "singed", "sing"], "sing – sang – sung."]]}];
const PAL=["#4FB3A9","#F59E0B","#F2A541","#6C8EE0","#14B8A6","#6A994E","#E07A5F","#3D9BD1"];
CH.forEach((c,i)=>{if(!c.color)c.color=PAL[i%PAL.length];if(!c.id)c.id="s"+i;});
const COUNTS=[10,25,50,"All"];
let selChaps=new Set(CH.map(c=>c.id)), selCount=25;
let deck=[],idx=0,score=0,answered=false,wrong=[],results={};
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderHome(){
  const cc=$("chapChips");cc.innerHTML="";
  const total=CH.reduce((n,c)=>n+c.qs.length,0);
  const all=document.createElement("button");all.className="chip";
  all.setAttribute("aria-pressed",selChaps.size===CH.length);
  all.innerHTML=`All sections <small>${total}</small>`;
  all.onclick=()=>{selChaps=selChaps.size===CH.length?new Set():new Set(CH.map(c=>c.id));renderHome();};
  cc.appendChild(all);
  CH.forEach(c=>{const b=document.createElement("button");b.className="chip";
    b.setAttribute("aria-pressed",selChaps.has(c.id));
    b.innerHTML=`<span class="dot" style="background:${c.color}"></span>${esc(c.name)} <small>${c.qs.length}</small>`;
    b.onclick=()=>{selChaps.has(c.id)?selChaps.delete(c.id):selChaps.add(c.id);renderHome();};
    cc.appendChild(b);});
  const kc=$("countChips");kc.innerHTML="";
  COUNTS.forEach(n=>{const b=document.createElement("button");b.className="chip";
    b.setAttribute("aria-pressed",selCount===n);b.textContent=n;
    b.onclick=()=>{selCount=n;renderHome();};kc.appendChild(b);});
  const pool=CH.filter(c=>selChaps.has(c.id)).reduce((n,c)=>n+c.qs.length,0);
  $("poolInfo").textContent=pool?`${pool} questions available`:"Pick at least one section";
  $("startBtn").disabled=!pool;
}
const build=list=>list.map(({c,q})=>({c,text:q[0],exp:q[2],opts:shuffle(q[1].map((t,i)=>({t,ok:i===0})))}));
function start(list){deck=list;idx=0;score=0;wrong=[];results={};show("quiz");renderQ();}
function startFromHome(){
  let pool=[];CH.filter(c=>selChaps.has(c.id)).forEach(c=>c.qs.forEach(q=>pool.push({c,q})));
  pool=shuffle(pool);if(selCount!=="All")pool=pool.slice(0,selCount);
  start(build(pool));
}
function show(id){["home","quiz","result"].forEach(s=>$(s).classList.toggle("hidden",s!==id));window.scrollTo(0,0);}
function renderQ(){
  answered=false;const d=deck[idx];
  $("qCount").textContent=`Question ${idx+1} of ${deck.length}`;
  $("qScore").textContent=`Score ${score}`;
  $("qBar").style.width=(idx/deck.length*100)+"%";
  $("qTag").innerHTML=`<span class="dot" style="background:${d.c.color}"></span>${esc(d.c.name)}`;
  $("qText").textContent=d.text;
  const o=$("qOpts");o.innerHTML="";
  d.opts.forEach((op,i)=>{const b=document.createElement("button");b.className="opt";
    b.innerHTML=`<b>${"ABCD"[i]}</b><span>${esc(op.t)}</span>`;b.onclick=()=>pick(i);o.appendChild(b);});
  $("qFb").className="fb";$("qFb").textContent="";
  $("nextBtn").disabled=true;$("nextBtn").textContent=idx===deck.length-1?"See score":"Next";
  o.firstChild.focus({preventScroll:true});
}
function pick(i){
  if(answered)return;answered=true;
  const d=deck[idx],btns=[...$("qOpts").children],ok=d.opts[i].ok;
  btns.forEach((b,j)=>{b.disabled=true;if(d.opts[j].ok)b.classList.add("ok");});
  const r=results[d.c.id]||(results[d.c.id]={c:d.c,right:0,total:0});r.total++;
  const fb=$("qFb"),ans=d.opts.find(x=>x.ok).t;
  if(ok){score++;r.right++;fb.className="fb show ok";fb.innerHTML=`<strong>Correct.</strong> ${esc(d.exp)}`;}
  else{btns[i].classList.add("bad");wrong.push({d,picked:d.opts[i].t});
    fb.className="fb show bad";fb.innerHTML=`<strong>Not quite.</strong> Answer: ${esc(ans.replace(/[.?!]$/,""))}. ${esc(d.exp)}`;}
  $("qScore").textContent=`Score ${score}`;
  $("nextBtn").disabled=false;$("nextBtn").focus({preventScroll:true});
}
function next(){if(!answered)return;idx++;idx<deck.length?renderQ():finish();}
function finish(){
  const n=Object.values(results).reduce((s,r)=>s+r.total,0);
  show("result");
  $("rScore").textContent=`${score}/${n}`;
  const pct=n?Math.round(score/n*100):0;$("rPct").textContent=`${pct}%`;
  $("rMsg").textContent=!n?"No questions answered.":pct>=90?"Excellent — you know this very well.":pct>=70?"Good work. Review the mistakes below to close the gaps.":pct>=50?"Fair. Go through the mistakes, then retry them.":"Re-read the lesson, then retry the wrong answers.";
  $("rBrk").innerHTML=Object.values(results).map(r=>`<div><span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${r.c.color};margin-right:8px"></span>${esc(r.c.name)}</span><strong>${r.right}/${r.total}</strong></div>`).join("");
  $("retryWrongBtn").classList.toggle("hidden",!wrong.length);
  $("revPanel").classList.toggle("hidden",!wrong.length);
  $("rRev").innerHTML=wrong.map(w=>`<div class="rev"><p><strong>${esc(w.d.text)}</strong></p><p class="y">Your answer: ${esc(w.picked)}</p><p class="c">Correct: ${esc(w.d.opts.find(x=>x.ok).t)}</p><p class="hint">${esc(w.d.exp)}</p></div>`).join("");
}
$("startBtn").onclick=startFromHome;
$("nextBtn").onclick=next;
$("quitBtn").onclick=finish;
$("homeBtn").onclick=()=>{show("home");renderHome();};
$("retryWrongBtn").onclick=()=>start(shuffle(wrong.map(w=>({...w.d,opts:shuffle(w.d.opts)}))));
document.addEventListener("keydown",e=>{
  if($("quiz").classList.contains("hidden"))return;
  const k=parseInt(e.key,10);
  if(k>=1&&k<=4&&!answered&&deck[idx].opts[k-1])pick(k-1);
  else if(e.key==="Enter"&&answered){e.preventDefault();next();}
});
renderHome();
</script>
</body>
