<style>
:root{
  --bg:#f3ead8; --surface:#fffaf0; --ink:#2b2118; --muted:#7a6a58; --line:#e2d4ba;
  --accent:#b5541b; --accent-ink:#fff; --indigo:#2f3e75;
  --ok-bg:#e3f1df; --ok:#2e7a35; --bad-bg:#f8e1dc; --bad:#b23a2a;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1b1712; --surface:#262019; --ink:#f1e7d6; --muted:#b3a38c; --line:#3d3328;
    --accent:#e08a4a; --accent-ink:#1b1712; --indigo:#a9b7f0;
    --ok-bg:#1f3322; --ok:#7fd08a; --bad-bg:#3d211c; --bad:#f08f7f;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font:16px/1.5 "Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1,h2,.q{font-family:Fraunces,Georgia,"Times New Roman",serif}
h1{font-size:2rem;line-height:1.1;margin:8px 0 6px;color:var(--indigo)}
.sub{color:var(--muted);margin:0 0 20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
h2{font-size:1.1rem;margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;
  padding:7px 12px;font:inherit;font-size:.9rem;cursor:pointer}
.chip small{color:var(--muted);margin-left:4px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.8}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:11px 18px;cursor:pointer;border:1.5px solid var(--line);background:transparent;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.chip:focus-visible,.opt:focus-visible{outline:3px solid var(--indigo);outline-offset:2px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin-bottom:6px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.tag{font-size:.8rem;color:var(--indigo);font-weight:700;margin-bottom:6px}
.q{font-size:1.3rem;line-height:1.3;margin:0 0 16px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:var(--ink);
  background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:10px;cursor:pointer}
.opt b{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--line);font-size:.85rem}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)} .opt.ok b{background:var(--ok);color:var(--surface)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)} .opt.bad b{background:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.fb{border-left:4px solid;border-radius:8px;padding:10px 12px;margin:6px 0 14px}
.fb.ok{border-color:var(--ok);background:var(--ok-bg)} .fb.bad{border-color:var(--bad);background:var(--bad-bg)}
.actions{display:flex;justify-content:space-between;margin-top:6px}
.big{font-family:Fraunces,Georgia,serif;font-size:3rem;line-height:1;margin:4px 0}
.big span{font-size:1rem;color:var(--muted);font-family:"Nunito Sans",sans-serif;margin-left:6px}
.brk{list-style:none;padding:0;margin:14px 0}
.brk li{display:flex;justify-content:space-between;padding:8px 10px;border-radius:8px;background:var(--bg);margin-bottom:6px;font-size:.92rem}
.rev{margin-top:16px}
.rev div{padding:10px 0;border-top:1px solid var(--line);font-size:.93rem}
.rev .y{color:var(--bad)} .rev .c{color:var(--ok);font-weight:700}
.tip{color:var(--muted);font-size:.85rem;margin-top:14px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>

const Q=[{"c": "Trade & Age of Reorganisation", "q": "The Second Urbanisation was marked by:", "a": "Expansion in agriculture, growth of trade and rise of towns", "w": ["Decline of towns", "Only iron tools", "Vedic sacrifices"], "e": "Agriculture expanded, trade grew and towns rose."}, {"c": "Trade & Age of Reorganisation", "q": "Craftsmen first settled in areas where:", "a": "Raw material was easily available", "w": ["Ports were nearby", "Kings lived", "Rivers met the sea"], "e": "They settled near raw material."}, {"c": "Trade & Age of Reorganisation", "q": "Trade developed when craftsmen:", "a": "Moved away from the source of raw material", "w": ["Became farmers", "Joined the army", "Stopped working"], "e": "Traders then supplied them with materials."}, {"c": "Trade & Age of Reorganisation", "q": "Traders bought raw materials from ___ and sold them to craftsmen in distant towns.", "a": "Villages", "w": ["Ports", "Temples", "Forts"], "e": "Villages supplied the raw material."}, {"c": "Trade & Age of Reorganisation", "q": "India traded with which regions of the outside world?", "a": "African and Southeast Asian countries", "w": ["Only China", "Only Europe", "Only Arabia"], "e": "Africa and Southeast Asia are named in the text."}, {"c": "Trade & Age of Reorganisation", "q": "Traders preferred to travel by:", "a": "Sea", "w": ["Road", "River", "Camel caravan"], "e": "Many new sea routes developed."}, {"c": "Trade & Age of Reorganisation", "q": "Which became an important industry due to sea trade?", "a": "Shipbuilding", "w": ["Mining", "Weaving", "Pottery"], "e": "Shipbuilding grew with sea trade."}, {"c": "Trade & Age of Reorganisation", "q": "Brisk trading led to the growth of many towns:", "a": "Along the coasts", "w": ["In deserts", "In the Himalayas", "Around forests"], "e": "Coastal towns grew."}, {"c": "Trade & Age of Reorganisation", "q": "Roman traders did NOT come to India to buy:", "a": "Horses", "w": ["Spices", "Sandalwood", "Muslin"], "e": "They bought spices, sandalwood, silk and muslin."}, {"c": "Trade & Age of Reorganisation", "q": "What proves trade between Rome and India?", "a": "Roman gold coins found in South India", "w": ["Roman temples in Delhi", "Latin inscriptions in Magadha", "Roman forts in Punjab"], "e": "Abundant Roman gold coins found in South India."}, {"c": "Trade & Age of Reorganisation", "q": "The post-Mauryan age (200 BCE–300 CE) is also called the:", "a": "Age of reorganisation", "w": ["Golden Age", "Vedic Age", "Sangam Age"], "e": "New kingdoms kept emerging and fighting for supremacy."}, {"c": "Trade & Age of Reorganisation", "q": "Central Asian tribes invaded India through the:", "a": "Khyber and Bolan passes", "w": ["Palghat Gap", "Nathu La pass", "Bay of Bengal"], "e": "They came from the North-west through these passes."}, {"c": "Trade & Age of Reorganisation", "q": "Why could Central Asian tribes invade India in this period?", "a": "There was no strong ruler", "w": ["India had no army", "They were invited", "India was under Rome"], "e": "The absence of a strong ruler after the Mauryas."}, {"c": "Trade & Age of Reorganisation", "q": "Which areas did the invading tribes NOT occupy?", "a": "Tamil Nadu", "w": ["Punjab", "Sind", "Afghanistan"], "e": "They occupied Punjab, Sind, Rajasthan, present-day Pakistan and Afghanistan."}, {"c": "Trade & Age of Reorganisation", "q": "Most of the invading kings were followers of:", "a": "The Buddha", "w": ["Mahavira", "Zoroaster", "Vedic priests"], "e": "They helped spread Buddhism."}, {"c": "Indo-Greeks, Shungas, Kanvas, Parthians", "q": "In the 2nd century BCE, the Bactrians occupied territory up to Punjab under:", "a": "Demetrius", "w": ["Seleucus", "Menander", "Kadphises I"], "e": "Demetrius led the Bactrians."}, {"c": "Indo-Greeks, Shungas, Kanvas, Parthians", "q": "The Bactrians were originally under:", "a": "Seleucus, Alexander's general", "w": ["Ashoka", "Kanishka", "Darius"], "e": "Seleucus was Alexander's general."}, {"c": "Indo-Greeks, Shungas, Kanvas, Parthians", "q": "By when had the Bactrians declared independence?", "a": "300 BCE", "w": ["185 BCE", "78 CE", "27 BCE"], "e": "By 300 BCE."}, {"c": "Indo-Greeks, Shungas, Kanvas, Parthians", "q": "The most famous Indo-Greek ruler was:", "a": "Menander (Milinda)", "w": ["Demetrius", "Gondophernes", "Kharavela"], "e": "Menander, also called Milinda."}, {"c": "Indo-Greeks, Shungas, Kanvas, Parthians", "q": "Menander converted to Buddhism under the influence of:", "a": "Nagasena", "w": ["Vasumitra", "Nagarjuna", "Ashvaghosha"], "e": "The Buddhist monk Nagasena."}, {"c": "Indo-Greeks, Shungas, Kanvas, Parthians", "q": "The dialogue between Menander and Nagasena is compiled in:", "a": "Milindapanho", "w": ["Buddhacharita", "Pitakas", "Jataka tales"], "e": "The book Milindapanho."}, {"c": "Indo-Greeks, Shungas, Kanvas, Parthians", "q": "Indo-Greek coins had inscriptions in:", "a": "Greek and Kharoshthi", "w": ["Greek and Tamil", "Latin and Brahmi", "Only Sanskrit"], "e": "Both Greek and Kharoshthi scripts."}, {"c": "Indo-Greeks, Shungas, Kanvas, Parthians", "q": "The Shunga dynasty was founded in:", "a": "185 BCE", "w": ["72 BCE", "78 CE", "300 BCE"], "e": "Pushyamitra Shunga founded it in 185 BCE."}, {"c": "Indo-Greeks, Shungas, Kanvas, Parthians", "q": "Who founded the Shunga dynasty?", "a": "Pushyamitra Shunga", "w": ["Brihadratha", "Kharavela", "Demetrius"], "e": "Pushyamitra Shunga."}, {"c": "Indo-Greeks, Shungas, Kanvas, Parthians", "q": "The last Mauryan ruler was:", "a": "Brihadratha", "w": ["Ashoka", "Bindusara", "Pushyamitra"], "e": "Pushyamitra defeated Brihadratha."}, {"c": "Indo-Greeks, Shungas, Kanvas, Parthians", "q": "Pushyamitra performed the Ashwamedha yajna after defeating the:", "a": "Bactrians", "w": ["Sakas", "Kanvas", "Cholas"], "e": "He fought Bactrian invaders from the North-west."}, {"c": "Indo-Greeks, Shungas, Kanvas, Parthians", "q": "The Shungas ruled for about:", "a": "112 years", "w": ["45 years", "200 years", "24 years"], "e": "About 112 years."}, {"c": "Indo-Greeks, Shungas, Kanvas, Parthians", "q": "The Shungas were succeeded by the:", "a": "Kanvas", "w": ["Kushanas", "Satavahanas", "Guptas"], "e": "The Kanva dynasty."}, {"c": "Indo-Greeks, Shungas, Kanvas, Parthians", "q": "The Kanva dynasty ruled from:", "a": "72 BCE to 27 BCE", "w": ["185 BCE to 72 BCE", "106 to 130 CE", "130 to 150 CE"], "e": "72 BCE to 27 BCE."}, {"c": "Indo-Greeks, Shungas, Kanvas, Parthians", "q": "The Kanvas ruled only over the region around:", "a": "Magadha", "w": ["Kalinga", "Taxila", "Madurai"], "e": "Only around Magadha."}, {"c": "Indo-Greeks, Shungas, Kanvas, Parthians", "q": "Which kingdom became prominent around 1 BCE?", "a": "Kalinga", "w": ["Magadha", "Bactria", "Chola"], "e": "Kalinga, under King Kharavela."}, {"c": "Indo-Greeks, Shungas, Kanvas, Parthians", "q": "The king of Kalinga who took the title Chakravartin was:", "a": "Kharavela", "w": ["Karikala", "Gondophernes", "Rudradaman"], "e": "Kharavela assumed the title Chakravartin."}, {"c": "Indo-Greeks, Shungas, Kanvas, Parthians", "q": "The Parthians originally belonged to:", "a": "Central Asia", "w": ["China", "South India", "Greece"], "e": "They also came from Central Asia."}, {"c": "Indo-Greeks, Shungas, Kanvas, Parthians", "q": "The Parthians occupied North-west India by defeating the:", "a": "Sakas", "w": ["Kushanas", "Shungas", "Greeks"], "e": "They defeated the Sakas."}, {"c": "Indo-Greeks, Shungas, Kanvas, Parthians", "q": "The most famous Parthian ruler was:", "a": "Gondophernes", "w": ["Kadphises I", "Menander", "Demetrius"], "e": "Gondophernes."}, {"c": "Indo-Greeks, Shungas, Kanvas, Parthians", "q": "The Parthian capital was at:", "a": "Taxila", "w": ["Purushapur", "Ujjain", "Vanji"], "e": "Gondophernes ruled from Taxila."}, {"c": "Kushanas & Kanishka", "q": "The Kushanas belonged to the nomadic ___ tribe of China.", "a": "Yeuh Chi", "w": ["Scythian", "Bactrian", "Parthian"], "e": "The Yeuh Chi tribe."}, {"c": "Kushanas & Kanishka", "q": "The Kushanas defeated the Sakas and captured:", "a": "Bactria", "w": ["Magadha", "Kalinga", "Madurai"], "e": "They captured Bactria."}, {"c": "Kushanas & Kanishka", "q": "The Kushanas were divided into how many principalities?", "a": "Five", "w": ["Three", "Seven", "Two"], "e": "Five principalities."}, {"c": "Kushanas & Kanishka", "q": "A principality is:", "a": "A small sovereign state ruled by a prince", "w": ["A large empire", "A Buddhist monastery", "A trade guild"], "e": "Small sovereign state under a monarch, ruled by a prince."}, {"c": "Kushanas & Kanishka", "q": "Who united the Kushanas?", "a": "Kadphises I", "w": ["Kanishka", "Menander", "Gondophernes"], "e": "Kadphises I united the five principalities."}, {"c": "Kushanas & Kanishka", "q": "Kadphises I captured:", "a": "Kabul and Kashmir", "w": ["Magadha and Kalinga", "Madurai and Vanji", "Bharuch and Nashik"], "e": "Kabul and Kashmir."}, {"c": "Kushanas & Kanishka", "q": "The Silk Route was controlled by the:", "a": "Kushanas", "w": ["Shungas", "Cholas", "Satavahanas"], "e": "Giving them flourishing trade."}, {"c": "Kushanas & Kanishka", "q": "Kushana trade flourished with:", "a": "Central Asia, China and Western Asia", "w": ["Rome only", "Africa only", "Japan and Korea"], "e": "Thanks to the Silk Route."}, {"c": "Kushanas & Kanishka", "q": "Which were important Kushana commercial centres?", "a": "Taxila, Ujjain and Mathura", "w": ["Madurai, Vanji, Kaveri", "Nashik, Bharuch, Amaravati", "Kashi, Pataliputra, Gaya"], "e": "Taxila, Ujjain and Mathura."}, {"c": "Kushanas & Kanishka", "q": "The first rulers of the subcontinent to issue gold coins were the:", "a": "Kushanas", "w": ["Mauryas", "Guptas", "Satavahanas"], "e": "Proof of Kushana prosperity."}, {"c": "Kushanas & Kanishka", "q": "The greatest Kushana ruler was:", "a": "Kanishka", "w": ["Kadphises I", "Gondophernes", "Rudradaman"], "e": "Kanishka, 78–101 CE."}, {"c": "Kushanas & Kanishka", "q": "Kanishka ruled from:", "a": "78–101 CE", "w": ["106–130 CE", "130–150 CE", "185–72 BCE"], "e": "78–101 CE."}, {"c": "Kushanas & Kanishka", "q": "Kanishka's capital was:", "a": "Purushapur (modern Peshawar)", "w": ["Taxila", "Mathura", "Ujjain"], "e": "Purushapur, modern Peshawar."}, {"c": "Kushanas & Kanishka", "q": "Which area was NOT part of Kanishka's empire?", "a": "Tamil Nadu", "w": ["Afghanistan", "Kashmir", "Parts of Central Asia"], "e": "His empire included Afghanistan, Kashmir, Punjab, parts of UP, Bihar and Central Asia."}, {"c": "Kushanas & Kanishka", "q": "Kanishka founded a new era in 78 CE called the:", "a": "Saka Era", "w": ["Gupta Era", "Vikram Era", "Kali Era"], "e": "The Saka Era."}, {"c": "Kushanas & Kanishka", "q": "The official Indian calendar used by the Government of India is based on the:", "a": "Saka Era", "w": ["Vikram Era", "Gregorian calendar only", "Gupta Era"], "e": "It is based on the Saka Era."}, {"c": "Kushanas & Kanishka", "q": "The first month of the Saka calendar is:", "a": "Chaitra", "w": ["Vaishakha", "Kartika", "Magha"], "e": "Chaitra."}, {"c": "Kushanas & Kanishka", "q": "Kanishka built a monastery at:", "a": "Peshawar", "w": ["Sanchi", "Taxila", "Madurai"], "e": "At Peshawar, besides many stupas and viharas."}, {"c": "Kushanas & Kanishka", "q": "Kanishka built many:", "a": "Stupas and viharas", "w": ["Forts and palaces", "Temples to Vishnu", "Ports"], "e": "Stupas and viharas."}, {"c": "Kushanas & Kanishka", "q": "What happened after Kanishka's death?", "a": "The Kushana Empire slowly declined", "w": ["It expanded to South India", "It was taken by Rome", "It became Shunga land"], "e": "The empire slowly declined."}, {"c": "Kushanas & Kanishka", "q": "The Gandhara and Mathura schools of art emerged during the reign of the:", "a": "Kushanas", "w": ["Shungas", "Cholas", "Satavahanas"], "e": "During Kushana rule."}, {"c": "Kushanas & Kanishka", "q": "The Gandhara school was a blend of:", "a": "Indian and Greek styles", "w": ["Indian and Chinese styles", "Roman and Persian styles", "Tamil and Greek styles"], "e": "Indian and Greek."}, {"c": "Kushanas & Kanishka", "q": "The Gandhara school emerged in:", "a": "The western regions of Punjab", "w": ["Uttar Pradesh", "Kalinga", "Tamilakam"], "e": "Western Punjab."}, {"c": "Kushanas & Kanishka", "q": "Buddha images in flowing robes with intricate details belong to the:", "a": "Gandhara school", "w": ["Mathura school", "Sangam school", "Sanchi school"], "e": "Gandhara style."}, {"c": "Kushanas & Kanishka", "q": "Indian deities carved mainly in red sandstone belong to the:", "a": "Mathura school", "w": ["Gandhara school", "Amaravati school", "Chola school"], "e": "Mathura style, Mathura region of UP."}, {"c": "Satavahanas & Sakas", "q": "Why did the Shungas and Kanvas fail to build a strong empire?", "a": "They spent their energy on internal revolts and foreign invasions", "w": ["They had no army", "They became monks", "Rome defeated them"], "e": "This created a political vacuum."}, {"c": "Satavahanas & Sakas", "q": "The political vacuum after the Shungas and Kanvas led to:", "a": "The rise of strong regional powers", "w": ["Roman rule", "The end of trade", "The Vedic Age"], "e": "Strong regional powers emerged."}, {"c": "Satavahanas & Sakas", "q": "The Satavahanas ruled Central India, around:", "a": "Nashik", "w": ["Madurai", "Taxila", "Magadha"], "e": "The region around Nashik."}, {"c": "Satavahanas & Sakas", "q": "The greatest Satavahana ruler was:", "a": "Gautamiputra Satakarni", "w": ["Vashishthiputra", "Rudradaman", "Pushyamitra"], "e": "Gautamiputra Satakarni."}, {"c": "Satavahanas & Sakas", "q": "Gautamiputra Satakarni ruled from:", "a": "106 to 130 CE", "w": ["78 to 101 CE", "130 to 150 CE", "72 to 27 BCE"], "e": "106–130 CE."}, {"c": "Satavahanas & Sakas", "q": "Gautamiputra's conquests took him north of which river?", "a": "Narmada", "w": ["Ganga", "Kaveri", "Indus"], "e": "North of the Narmada, into Malwa, Gujarat, Konkan and Kathiawar."}, {"c": "Satavahanas & Sakas", "q": "Which region did Gautamiputra NOT conquer?", "a": "Kashmir", "w": ["Malwa", "Konkan", "Kathiawar"], "e": "He took Malwa, Gujarat, Konkan, Kathiawar and the Godavari area."}, {"c": "Satavahanas & Sakas", "q": "After his northern conquests, Gautamiputra conquered the:", "a": "Godavari area", "w": ["Kaveri delta", "Indus valley", "Ganga plain"], "e": "The Godavari area."}, {"c": "Satavahanas & Sakas", "q": "Who took the title 'Lord of the Southern Regions'?", "a": "Gautamiputra Satakarni", "w": ["Kanishka", "Karikala", "Kharavela"], "e": "Gautamiputra Satakarni."}, {"c": "Satavahanas & Sakas", "q": "The Satavahanas were in constant conflict with the:", "a": "Sakas", "w": ["Cholas", "Kushanas", "Romans"], "e": "The Sakas ruled Gujarat and parts of the Deccan."}, {"c": "Satavahanas & Sakas", "q": "Gautamiputra's son Vashishthiputra married the daughter of:", "a": "Rudradaman", "w": ["Kanishka", "Menander", "Gondophernes"], "e": "To build good relations with the Sakas."}, {"c": "Satavahanas & Sakas", "q": "Satavahana power had declined by:", "a": "220 CE", "w": ["78 CE", "400 CE", "27 BCE"], "e": "By 220 CE."}, {"c": "Satavahanas & Sakas", "q": "Much about Gautamiputra's reign is known from an inscription by:", "a": "His mother, Gautami Balashri", "w": ["Nagasena", "Vasumitra", "His son"], "e": "Gautami Balashri."}, {"c": "Satavahanas & Sakas", "q": "The Satavahanas linked the Aryan culture of the North with:", "a": "The culture of South India", "w": ["Greek culture", "Chinese culture", "Roman culture"], "e": "A link between North and South."}, {"c": "Satavahanas & Sakas", "q": "Satavahana inland trade ran between the Deccan and:", "a": "North-west India", "w": ["Sri Lanka", "Bengal", "Kalinga"], "e": "Deccan and North-west India."}, {"c": "Satavahanas & Sakas", "q": "The Satavahana port for trade with Iran and Arab countries was:", "a": "Bharuch, Gujarat", "w": ["Madurai", "Vanji", "Taxila"], "e": "Bharuch in Gujarat."}, {"c": "Satavahanas & Sakas", "q": "The Satavahanas worshipped Shiva and Vishnu but also patronised:", "a": "Buddhism and Jainism", "w": ["Only Vedic rituals", "Christianity", "Zoroastrianism"], "e": "Buddhism and Jainism."}, {"c": "Satavahanas & Sakas", "q": "Which was built during Satavahana rule?", "a": "The gateway of the Sanchi stupa", "w": ["Monastery at Peshawar", "Temple at Madurai", "Pillar at Taxila"], "e": "With beautiful sculptures."}, {"c": "Satavahanas & Sakas", "q": "The Sakas were also called the:", "a": "Scythians", "w": ["Bactrians", "Parthians", "Yeuh Chi"], "e": "Also known as Indo-Scythians."}, {"c": "Satavahanas & Sakas", "q": "The Sakas came from:", "a": "Central Asia", "w": ["China", "Greece", "South India"], "e": "A tribe from Central Asia."}, {"c": "Satavahanas & Sakas", "q": "The Sakas were divided into how many branches?", "a": "Five", "w": ["Three", "Two", "Eleven"], "e": "Five branches."}, {"c": "Satavahanas & Sakas", "q": "Which area was NOT ruled by Saka branches?", "a": "Kerala", "w": ["Afghanistan", "Mathura", "Deccan"], "e": "They ruled Afghanistan, Punjab, Mathura, Deccan and parts of western India."}, {"c": "Satavahanas & Sakas", "q": "Saka provincial governors were called:", "a": "Satraps", "w": ["Mahamatras", "Nayakas", "Viceroys"], "e": "Satraps."}, {"c": "Satavahanas & Sakas", "q": "The most famous Saka ruler was:", "a": "Rudradaman", "w": ["Gondophernes", "Vasumitra", "Kadphises I"], "e": "Rudradaman, governor of Ujjain."}, {"c": "Satavahanas & Sakas", "q": "Rudradaman was the governor of:", "a": "Ujjain", "w": ["Taxila", "Nashik", "Mathura"], "e": "Ujjain, ruling 130–150 CE."}, {"c": "Satavahanas & Sakas", "q": "Rudradaman ruled from:", "a": "130–150 CE", "w": ["106–130 CE", "78–101 CE", "185–72 BCE"], "e": "130–150 CE."}, {"c": "Satavahanas & Sakas", "q": "In the 4th century CE, the Sakas were defeated by the:", "a": "Guptas", "w": ["Kushanas", "Mauryas", "Cholas"], "e": "The Guptas."}, {"c": "Sangam Age", "q": "The Sangam Age refers to which region?", "a": "Tamilakam, the Tamil-speaking areas of South India", "w": ["Magadha", "Bactria", "Kalinga"], "e": "Ancient Tamil-speaking areas."}, {"c": "Sangam Age", "q": "The Sangam Age spanned roughly:", "a": "3rd century BCE to 4th century CE", "w": ["6th to 10th century CE", "185 BCE to 27 BCE", "1st to 2nd century CE"], "e": "3rd century BCE to 4th century CE."}, {"c": "Sangam Age", "q": "The word Sangam means:", "a": "Confluence; also academy or assembly", "w": ["Temple", "King", "River"], "e": "Confluence, academy or assembly."}, {"c": "Sangam Age", "q": "Sangam refers to the gathering of Tamil poets and scholars in:", "a": "Madurai", "w": ["Vanji", "Kanchi", "Ujjain"], "e": "The city of Madurai."}, {"c": "Sangam Age", "q": "Sangam literature contains about:", "a": "2381 poems by over 470 poets", "w": ["470 poems by 2381 poets", "1000 poems by 100 poets", "112 poems by 11 poets"], "e": "2381 poems, over 470 poets."}, {"c": "Sangam Age", "q": "Sangam literature is a collection of:", "a": "Classical Tamil literature", "w": ["Sanskrit epics", "Greek plays", "Buddhist Pitakas"], "e": "Classical Tamil."}, {"c": "Sangam Age", "q": "Muvendar means:", "a": "The three kings", "w": ["The five rivers", "The great assembly", "The southern lord"], "e": "Cheras, Cholas and Pandyas."}, {"c": "Sangam Age", "q": "Which was NOT one of the Muvendar?", "a": "Satavahanas", "w": ["Cheras", "Cholas", "Pandyas"], "e": "The three were Cheras, Cholas and Pandyas."}, {"c": "Sangam Age", "q": "The Chola kingdom was called:", "a": "Cholamandala", "w": ["Keralaputra", "Tamilakam", "Muvendar"], "e": "Cholamandala."}, {"c": "Sangam Age", "q": "The earliest Chola ruler was:", "a": "Karikala", "w": ["Nedunjeral Adan", "Kharavela", "Rudradaman"], "e": "Karikala."}, {"c": "Sangam Age", "q": "Karikala defeated the Pandyas, Cheras and how many minor chiefs?", "a": "Eleven", "w": ["Five", "Three", "Twelve"], "e": "Eleven minor chiefs."}, {"c": "Sangam Age", "q": "The Cholas were powerful from:", "a": "200 BCE to 400 CE", "w": ["72 BCE to 27 BCE", "9th to 10th century CE", "106 to 130 CE"], "e": "Then defeated by the Pandyas and Cheras."}, {"c": "Sangam Age", "q": "The Cholas became a prominent empire again in the:", "a": "9th–10th century CE", "w": ["1st century BCE", "4th century CE", "2nd century BCE"], "e": "Early medieval period."}, {"c": "Sangam Age", "q": "The Cheras were also known as:", "a": "Keralaputra", "w": ["Cholamandala", "Muvendar", "Satraps"], "e": "Keralaputra."}, {"c": "Sangam Age", "q": "The Cheras ruled present-day Kerala on the:", "a": "Malabar Coast", "w": ["Coromandel Coast", "Konkan Coast", "Kathiawar Coast"], "e": "Malabar Coast."}, {"c": "Sangam Age", "q": "The capital of the Cheras was:", "a": "Vanji", "w": ["Madurai", "Taxila", "Purushapur"], "e": "Vanji."}, {"c": "Sangam Age", "q": "The most famous Chera king was:", "a": "Nedunjeral Adan", "w": ["Karikala", "Rudradaman", "Kharavela"], "e": "Nedunjeral Adan."}, {"c": "Sangam Age", "q": "The Cheras encouraged trade with:", "a": "Rome and Egypt", "w": ["China and Japan", "Iran and Arabia", "Africa only"], "e": "Rome and Egypt."}, {"c": "Sangam Age", "q": "The Chera rulers granted land to the Jewish trader:", "a": "Joseph Rabban", "w": ["Nagasena", "Kumarajiva", "Gondophernes"], "e": "Earliest evidence of a Jewish community in India."}, {"c": "Sangam Age", "q": "The Pandyas controlled the region around Madurai and parts of:", "a": "Tiruchirapalli", "w": ["Malabar", "Nashik", "Kalinga"], "e": "Madurai and parts of Tiruchirapalli."}, {"c": "Sangam Age", "q": "The Pandya region was famous for:", "a": "Pearls exported to Rome", "w": ["Gold coins", "Silk", "Horses"], "e": "Pearls exported to Rome."}, {"c": "Buddhism & Religion", "q": "The most famous royal patrons of Buddhism in this period were:", "a": "Kanishka and Menander", "w": ["Karikala and Rudradaman", "Pushyamitra and Kharavela", "Gondophernes and Kadphises"], "e": "Kanishka and the Indo-Bactrian king Menander."}, {"c": "Buddhism & Religion", "q": "The Fourth Buddhist Council was held at:", "a": "Kashmir", "w": ["Pataliputra", "Taxila", "Sanchi"], "e": "During Kanishka's reign."}, {"c": "Buddhism & Religion", "q": "The Fourth Buddhist Council was presided over by:", "a": "Vasumitra", "w": ["Ashvaghosha", "Nagarjuna", "Charaka"], "e": "The scholar Vasumitra."}, {"c": "Buddhism & Religion", "q": "Who wrote Buddhacharita?", "a": "Ashvaghosha", "w": ["Vasumitra", "Nagasena", "Kumarajiva"], "e": "Ashvaghosha."}, {"c": "Buddhism & Religion", "q": "Which scholar did NOT attend the Fourth Buddhist Council?", "a": "Nagasena", "w": ["Nagarjuna", "Taranath", "Charaka"], "e": "Attendees: Ashvaghosha, Nagarjuna, Taranath, Charaka (and Vasumitra)."}, {"c": "Buddhism & Religion", "q": "At the Fourth Council, Buddhism was formally divided into:", "a": "Mahayana and Hinayana", "w": ["Shaiva and Vaishnava", "Theravada and Zen", "Digambara and Shvetambara"], "e": "Mahayana and Hinayana."}, {"c": "Buddhism & Religion", "q": "The decisions of the Fourth Council were inscribed on:", "a": "Copper plates", "w": ["Palm leaves", "Stone pillars", "Gold coins"], "e": "Placed in a stone chest, preserved in a stupa."}, {"c": "Buddhism & Religion", "q": "The Fourth Council's copper plates were kept in a stone chest and preserved in a:", "a": "Stupa", "w": ["Palace", "River", "Temple of Vishnu"], "e": "A stupa."}, {"c": "Buddhism & Religion", "q": "Mahayana Buddhism became prominent during the reign of:", "a": "Kanishka", "w": ["Menander", "Ashoka", "Karikala"], "e": "Kanishka."}, {"c": "Buddhism & Religion", "q": "Mahayana literally means:", "a": "Greater vehicle", "w": ["Lesser vehicle", "Middle path", "Noble truth"], "e": "Greater vehicle."}, {"c": "Buddhism & Religion", "q": "Which sect did NOT believe in idol worship or worship of Bodhisattvas?", "a": "Hinayana", "w": ["Mahayana", "Bhakti followers", "Shaivites"], "e": "Hinayana."}, {"c": "Buddhism & Religion", "q": "Bodhisattva worship was popular in Central Asia, China, Korea and:", "a": "Japan", "w": ["Rome", "Egypt", "Greece"], "e": "And Japan."}, {"c": "Buddhism & Religion", "q": "Which were written during this period?", "a": "Jataka tales and Buddhacharita", "w": ["Vedas and Upanishads", "Ramayana and Mahabharata", "Arthashastra and Indica"], "e": "Jataka tales and Ashvaghosha's Buddhacharita."}, {"c": "Buddhism & Religion", "q": "Vasumitra compiled Buddhist doctrines in three volumes called the:", "a": "Pitakas", "w": ["Jatakas", "Sangam", "Milindapanho"], "e": "The Pitakas."}, {"c": "Buddhism & Religion", "q": "Who played an important role in spreading Buddhism abroad?", "a": "The Buddhist sangha", "w": ["Roman traders", "The Satraps", "The Muvendar"], "e": "To West Asia, Central Asia, Korea, Japan and China."}, {"c": "Buddhism & Religion", "q": "As Buddhism spread to China, many Chinese scholars:", "a": "Travelled to India", "w": ["Banned it", "Went to Rome", "Wrote in Tamil"], "e": "Chinese scholars travelled to India."}, {"c": "Buddhism & Religion", "q": "Indian scholars carried ___ manuscripts to China and translated them into Chinese.", "a": "Sanskrit", "w": ["Tamil", "Greek", "Kharoshthi"], "e": "Sanskrit manuscripts."}, {"c": "Buddhism & Religion", "q": "An Indian scholar who wrote books in Chinese was:", "a": "Kumarajiva", "w": ["Charaka", "Taranath", "Nagasena"], "e": "Kumarajiva."}, {"c": "Buddhism & Religion", "q": "In this period, worship of which gods became common?", "a": "Shiva and Vishnu", "w": ["Indra and Agni", "Varuna and Surya", "Zeus and Apollo"], "e": "Shiva and Vishnu."}, {"c": "Buddhism & Religion", "q": "Which goddess is NOT named among those worshipped then?", "a": "Saraswati", "w": ["Durga", "Parvati", "Gauri"], "e": "Durga, Parvati, Mahadevi and Gauri are named."}, {"c": "Buddhism & Religion", "q": "Unlike Vedic gods, the new gods were:", "a": "Not tied to any natural phenomenon", "w": ["Tied to rain and fire", "Worshipped only by priests", "Foreign gods"], "e": "Not tied to natural phenomena."}, {"c": "Buddhism & Religion", "q": "Bhakti means:", "a": "An individual's devotion to a chosen deity", "w": ["An elaborate sacrifice", "A Buddhist council", "A royal title"], "e": "Personal devotion."}, {"c": "Buddhism & Religion", "q": "Who could worship through bhakti?", "a": "Anyone, irrespective of caste, creed or sex", "w": ["Only Brahmins", "Only kings", "Only men"], "e": "Open to all."}, {"c": "Buddhism & Religion", "q": "Which was NOT an essential of bhakti worship?", "a": "Elaborate sacrifices", "w": ["Fasts and vows", "Pilgrimage", "Worship with a pure heart"], "e": "No elaborate sacrifices were performed."}, {"c": "Buddhism & Religion", "q": "People preferred bhakti because it had:", "a": "Wider appeal and a personal connection with god", "w": ["Costly rituals", "Royal support only", "Greek influence"], "e": "Wider appeal, more personal."}];
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const CH=[...new Set(Q.map(q=>q.c))];
let chap="All", count=25, set=[], i=0, score=0, answered=false, log=[];

function chip(label,n,pressed,on){const b=document.createElement('button');b.className='chip';b.setAttribute('aria-pressed',pressed);
  b.innerHTML=label+(n!=null?'<small>'+n+'</small>':'');b.onclick=on;return b}
function renderHome(){
  const c=$('chapters');c.innerHTML='';
  c.append(chip('All topics',Q.length,chap==='All',()=>{chap='All';renderHome()}));
  CH.forEach(h=>c.append(chip(h,Q.filter(q=>q.c===h).length,chap===h,()=>{chap=h;renderHome()})));
  const k=$('counts');k.innerHTML='';
  [10,25,50,'All'].forEach(n=>k.append(chip(String(n),null,count===n,()=>{count=n;renderHome()})));
  const pool=chap==='All'?Q:Q.filter(q=>q.c===chap);
  $('avail').textContent=pool.length+' questions available';
}
function start(list){
  set=list.map(q=>({...q,opts:shuffle([q.a,...q.w])}));i=0;score=0;log=[];
  $('home').hidden=true;$('result').hidden=true;$('quiz').hidden=false;show();
}
function show(){
  const q=set[i];answered=false;
  $('qnum').textContent='Question '+(i+1)+' of '+set.length;
  $('score').textContent='Score '+score;
  $('prog').style.width=(i/set.length*100)+'%';
  $('qtag').textContent=q.c;$('qtext').textContent=q.q;
  const o=$('opts');o.innerHTML='';
  q.opts.forEach((t,k)=>{const b=document.createElement('button');b.className='opt';
    b.innerHTML='<b>'+'ABCD'[k]+'</b><span></span>';b.lastChild.textContent=t;b.onclick=()=>pick(k);o.append(b)});
  $('fb').innerHTML='';$('next').disabled=true;
  $('next').textContent=i===set.length-1?'See score':'Next';
  window.scrollTo(0,0);
}
function pick(k){
  if(answered)return;answered=true;
  const q=set[i],btns=[...$('opts').children],ok=q.opts[k]===q.a;
  btns.forEach((b,n)=>{b.disabled=true;if(q.opts[n]===q.a)b.classList.add('ok')});
  if(!ok)btns[k].classList.add('bad');else score++;
  log.push({q,your:q.opts[k],ok});
  const f=document.createElement('div');f.className='fb '+(ok?'ok':'bad');
  f.innerHTML=ok?'<b>Correct.</b> ':'<b>Not quite.</b> Answer: ';
  f.append((ok?'':q.a+'. ')+q.e);
  $('fb').innerHTML='';$('fb').append(f);
  $('score').textContent='Score '+score;$('next').disabled=false;$('next').focus();
}
function next(){if(!answered)return;i++;i<set.length?show():finish()}
function finish(){
  $('quiz').hidden=true;$('result').hidden=false;
  const n=log.length,pct=n?Math.round(score/n*100):0;
  $('final').innerHTML=score+'/'+n+'<span>'+pct+'%</span>';
  const wrong=log.filter(l=>!l.ok);
  $('advice').textContent=!n?'No questions answered yet.':wrong.length?'Re-read the notes for the topics below, then retry the wrong answers.':'Every answer correct.';
  const by={};log.forEach(l=>{by[l.q.c]=by[l.q.c]||[0,0];by[l.q.c][1]++;if(l.ok)by[l.q.c][0]++});
  $('brk').innerHTML='';Object.entries(by).forEach(([c,[a,t]])=>{const li=document.createElement('li');
    li.innerHTML='<span></span><b>'+a+'/'+t+'</b>';li.firstChild.textContent=c;$('brk').append(li)});
  $('retry').hidden=!wrong.length;
  const r=$('rev');r.innerHTML=wrong.length?'<h2>Review mistakes</h2>':'';
  wrong.forEach(l=>{const d=document.createElement('div');
    d.innerHTML='<div style="border:0;padding:0"></div><div class="y" style="border:0;padding:0"></div><div class="c" style="border:0;padding:0"></div>';
    d.children[0].textContent=l.q.q;d.children[1].textContent='Your answer: '+l.your;d.children[2].textContent='Correct: '+l.q.a;r.append(d)});
}
$('start').onclick=()=>{const pool=shuffle(chap==='All'?Q:Q.filter(q=>q.c===chap));start(count==='All'?pool:pool.slice(0,count))};
$('next').onclick=next;$('end').onclick=finish;
$('retry').onclick=()=>start(shuffle(log.filter(l=>!l.ok).map(l=>l.q)));
$('newq').onclick=()=>{$('result').hidden=true;$('home').hidden=false;renderHome()};
document.addEventListener('keydown',e=>{if($('quiz').hidden)return;
  if(/^[1-4]$/.test(e.key))pick(+e.key-1);else if(e.key==='Enter'&&answered){e.preventDefault();next()}});
renderHome();
</script>
